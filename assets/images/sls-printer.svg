<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Illustration of a selective laser sintering printer fusing nylon powder">
  <rect width="1200" height="675" fill="#e8eaef"/>
  <g stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- cabinet -->
    <rect x="360" y="120" width="480" height="400" rx="14" fill="#ffffff"/>
    <!-- laser head -->
    <rect x="560" y="160" width="80" height="44" rx="8" fill="#ffffff"/>
    <path d="M600 204 v96" stroke="#a94418" stroke-width="5" stroke-dasharray="2 12"/>
    <path d="M586 300 h28 l-14 24 Z" fill="#a94418" stroke="none"/>
    <!-- powder bed -->
    <rect x="420" y="324" width="360" height="110" fill="#eceadf"/>
    <path d="M420 324 h360" stroke-width="8"/>
    <!-- part emerging from powder -->
    <path d="M556 324 q10 -40 44 -40 q34 0 44 40" fill="#c9dbe4"/>
    <!-- recoater -->
    <rect x="404" y="296" width="18" height="56" fill="#1a1a1a"/>
    <!-- controls -->
    <circle cx="448" cy="480" r="10" fill="#a94418" stroke="none"/>
    <circle cx="484" cy="480" r="10" fill="#1a1a1a" stroke="none"/>
    <line x1="320" y1="560" x2="880" y2="560"/>
  </g>
</svg>
