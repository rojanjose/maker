<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Illustration of calipers measuring a 3D-printed test model">
  <rect width="1200" height="675" fill="#e9efe9"/>
  <g stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- test print (little boat-ish shape) -->
    <path d="M480 420 h240 l-40 60 h-160 Z" fill="#c9dbe4"/>
    <rect x="560" y="330" width="80" height="90" fill="#ffffff"/>
    <rect x="588" y="290" width="24" height="40" fill="#a94418"/>
    <!-- calipers -->
    <line x1="330" y1="200" x2="880 " y2="200" stroke-width="10"/>
    <path d="M420 200 v140" stroke-width="10"/>
    <path d="M760 200 v140" stroke-width="10"/>
    <path d="M330 200 v-40 h60" />
    <!-- scale ticks -->
    <g stroke-width="3">
      <line x1="460" y1="200" x2="460" y2="220"/><line x1="510" y1="200" x2="510" y2="220"/>
      <line x1="560" y1="200" x2="560" y2="220"/><line x1="610" y1="200" x2="610" y2="220"/>
      <line x1="660" y1="200" x2="660" y2="220"/><line x1="710" y1="200" x2="710" y2="220"/>
    </g>
    <line x1="300" y1="540" x2="900" y2="540"/>
  </g>
</svg>
