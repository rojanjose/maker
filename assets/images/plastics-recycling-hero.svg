<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Illustration of a recycling sorting line — a conveyor carrying bottles and tubs toward stacked bales">
  <rect width="1200" height="675" fill="#efe9df"/>
  <g stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- items riding the belt -->
    <rect x="246" y="352" width="28" height="16" rx="5" fill="#a94418"/>
    <path d="M252 368 L252 380 Q234 396 234 416 L234 452 Q234 470 252 470 L276 470 Q294 470 294 452 L294 416 Q294 396 276 380 L276 368 Z" fill="#ffffff"/>
    <path d="M392 408 L400 460 Q401 470 412 470 L468 470 Q479 470 480 460 L488 408 Z" fill="#dce8f2"/>
    <rect x="576" y="356" width="30" height="16" rx="5" fill="#c9dbe4"/>
    <path d="M580 372 L580 386 Q556 396 556 418 L556 452 Q556 470 574 470 L634 470 Q652 470 652 452 L652 414 Q652 396 630 390 L612 385 L612 372 Z" fill="#ffffff"/>
    <!-- direction arrow -->
    <g stroke-width="5">
      <line x1="686" y1="396" x2="742" y2="396"/>
      <line x1="742" y1="396" x2="726" y2="384"/>
      <line x1="742" y1="396" x2="726" y2="408"/>
    </g>
    <!-- conveyor belt and rollers -->
    <rect x="150" y="470" width="640" height="34" rx="17" fill="#ffffff"/>
    <g stroke-width="5">
      <circle cx="220" cy="522" r="14" fill="#dce8f2"/>
      <circle cx="360" cy="522" r="14" fill="#dce8f2"/>
      <circle cx="500" cy="522" r="14" fill="#dce8f2"/>
      <circle cx="640" cy="522" r="14" fill="#dce8f2"/>
    </g>
    <line x1="250" y1="540" x2="250" y2="620" stroke-width="8"/>
    <line x1="620" y1="540" x2="620" y2="620" stroke-width="8"/>
    <!-- stacked bales -->
    <rect x="870" y="480" width="180" height="140" rx="8" fill="#c9dbe4"/>
    <line x1="922" y1="480" x2="922" y2="620" stroke-width="4"/>
    <line x1="998" y1="480" x2="998" y2="620" stroke-width="4"/>
    <rect x="888" y="350" width="144" height="130" rx="8" fill="#dce8f2"/>
    <line x1="930" y1="350" x2="930" y2="480" stroke-width="4"/>
    <line x1="990" y1="350" x2="990" y2="480" stroke-width="4"/>
    <!-- ground line -->
    <line x1="150" y1="620" x2="1060" y2="620"/>
  </g>
</svg>
