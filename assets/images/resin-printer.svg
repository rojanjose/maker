<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Illustration of a resin 3D printer lifting a print from the vat">
  <rect width="1200" height="675" fill="#efe9f0"/>
  <g stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- z tower -->
    <rect x="560" y="80" width="80" height="330" rx="8" fill="#ffffff"/>
    <!-- arm + build plate -->
    <rect x="500" y="180" width="200" height="30" fill="#ffffff"/>
    <rect x="470" y="210" width="260" height="18" fill="#1a1a1a"/>
    <!-- hanging print -->
    <path d="M560 228 v70 q40 40 80 0 v-70" fill="#b7a6d6"/>
    <path d="M575 298 q25 22 50 0" stroke-width="4"/>
    <!-- vat -->
    <rect x="440" y="380" width="320" height="60" rx="6" fill="#ffffff"/>
    <path d="M452 410 h296" stroke="#a94418" stroke-width="5"/>
    <!-- base -->
    <rect x="400" y="440" width="400" height="80" rx="10" fill="#ffffff"/>
    <circle cx="740" cy="480" r="12" fill="#a94418" stroke="none"/>
    <line x1="360" y1="560" x2="840" y2="560"/>
  </g>
</svg>
