<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Illustration of a spiral notepad, a mini PC and an SD card with its lock tab, arranged on a bench">
  <rect width="1200" height="675" fill="#efe9df"/>
  <g stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- spiral notepad, leaning left -->
    <g transform="rotate(-7 320 470)">
      <rect x="200" y="330" width="240" height="290" rx="10" fill="#ffffff"/>
      <circle cx="240" cy="330" r="12" stroke-width="4"/>
      <circle cx="290" cy="330" r="12" stroke-width="4"/>
      <circle cx="340" cy="330" r="12" stroke-width="4"/>
      <circle cx="390" cy="330" r="12" stroke-width="4"/>
      <line x1="235" y1="400" x2="405" y2="400" stroke-width="4"/>
      <line x1="235" y1="450" x2="405" y2="450" stroke-width="4"/>
      <line x1="235" y1="500" x2="360" y2="500" stroke-width="4"/>
      <line x1="235" y1="550" x2="390" y2="550" stroke-width="4" stroke="#a94418"/>
    </g>
    <!-- mini pc, center -->
    <rect x="520" y="440" width="250" height="180" rx="24" fill="#ffffff"/>
    <circle cx="576" cy="494" r="14" fill="#a94418"/>
    <rect x="646" y="482" width="46" height="16" rx="4" fill="#c9dbe4" stroke-width="4"/>
    <rect x="646" y="514" width="46" height="16" rx="4" fill="#c9dbe4" stroke-width="4"/>
    <line x1="558" y1="586" x2="732" y2="586" stroke-width="4"/>
    <!-- oversized sd card, leaning right -->
    <g transform="rotate(8 950 500)">
      <path d="M860 400 L1010 400 L1040 430 L1040 620 L860 620 Z" fill="#c9dbe4"/>
      <rect x="852" y="470" width="26" height="60" rx="6" fill="#a94418" stroke-width="5"/>
      <line x1="890" y1="440" x2="890" y2="475" stroke-width="4"/>
      <line x1="920" y1="440" x2="920" y2="475" stroke-width="4"/>
      <line x1="950" y1="440" x2="950" y2="475" stroke-width="4"/>
      <line x1="980" y1="440" x2="980" y2="475" stroke-width="4"/>
    </g>
    <!-- bench line -->
    <line x1="170" y1="620" x2="1030" y2="620"/>
  </g>
</svg>
