<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Illustration of a screen-printing frame and squeegee above a t-shirt">
  <rect width="1200" height="675" fill="#f2ece0"/>
  <g stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- screen frame with mesh -->
    <rect x="380" y="120" width="440" height="230" fill="#ffffff" stroke-width="10"/>
    <g stroke-width="2">
      <line x1="435" y1="130" x2="435" y2="340"/><line x1="490" y1="130" x2="490" y2="340"/>
      <line x1="545" y1="130" x2="545" y2="340"/><line x1="655" y1="130" x2="655" y2="340"/>
      <line x1="710" y1="130" x2="710" y2="340"/><line x1="765" y1="130" x2="765" y2="340"/>
      <line x1="390" y1="180" x2="810" y2="180"/><line x1="390" y1="235" x2="810" y2="235"/>
      <line x1="390" y1="290" x2="810" y2="290"/>
    </g>
    <!-- stencil opening -->
    <circle cx="600" cy="235" r="58" fill="#a94418"/>
    <!-- squeegee -->
    <line x1="470" y1="105" x2="730" y2="105" stroke-width="14"/>
    <line x1="600" y1="105" x2="600" y2="40" stroke-width="10"/>
    <line x1="560" y1="40" x2="640" y2="40" stroke-width="14"/>
    <!-- ink bead -->
    <path d="M470 92 q 20 -14 40 0 q 20 12 40 0 q 20 -14 40 0 q 20 12 40 0 q 20 -14 40 0" stroke-width="5" fill="none"/>
    <!-- tee below -->
    <path d="M545 430 L400 468 L436 528 L482 507 L482 620 L718 620 L718 507 L764 528 L800 468 L655 430 A 55 18 0 0 1 545 430 Z" fill="#c9dbe4"/>
    <path d="M545 430 a 55 18 0 0 0 110 0"/>
    <circle cx="600" cy="540" r="34" fill="#a94418"/>
    <!-- registration arrows: print lands on shirt -->
    <line x1="600" y1="370" x2="600" y2="415" stroke-width="8"/>
    <path d="M580 398 L600 420 L620 398" stroke-width="8"/>
  </g>
</svg>
