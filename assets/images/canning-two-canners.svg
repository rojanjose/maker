<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-label="Illustration comparing a water-bath kettle with submerged jars to a sealed pressure canner with a gauge">
  <rect width="1200" height="675" fill="#e9eef2"/>
  <g stroke="#1a1a1a" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- water-bath kettle, open -->
    <rect x="150" y="280" width="380" height="280" rx="18" fill="#ffffff"/>
    <rect x="162" y="340" width="356" height="212" rx="12" fill="#dce8f2" stroke="none"/>
    <path d="M162 340 q 30 -14 60 0 t 60 0 t 60 0 t 60 0 t 60 0 t 56 0" stroke-width="4"/>
    <!-- submerged jars on a rack -->
    <g stroke-width="4">
      <rect x="205" y="405" width="60" height="18" rx="5" fill="#c9dbe4"/>
      <rect x="200" y="423" width="70" height="112" rx="8" fill="#ffffff"/>
      <rect x="310" y="405" width="60" height="18" rx="5" fill="#c9dbe4"/>
      <rect x="305" y="423" width="70" height="112" rx="8" fill="#ffffff"/>
      <rect x="415" y="405" width="60" height="18" rx="5" fill="#c9dbe4"/>
      <rect x="410" y="423" width="70" height="112" rx="8" fill="#ffffff"/>
      <line x1="185" y1="542" x2="495" y2="542"/>
    </g>
    <g stroke-width="3">
      <circle cx="230" cy="500" r="6"/>
      <circle cx="340" cy="470" r="5"/>
      <circle cx="452" cy="505" r="6"/>
      <circle cx="288" cy="448" r="4"/>
    </g>
    <!-- gentle steam above the open kettle -->
    <g stroke-width="5">
      <path d="M280 250 q -13 -20 0 -40 q 13 -20 0 -40"/>
      <path d="M400 250 q -13 -20 0 -40 q 13 -20 0 -40"/>
    </g>
    <!-- pressure canner, sealed -->
    <rect x="680" y="304" width="360" height="256" rx="18" fill="#dce8f2"/>
    <rect x="665" y="262" width="390" height="42" rx="14" fill="#ffffff"/>
    <circle cx="676" cy="283" r="9" fill="#c9dbe4"/>
    <circle cx="1044" cy="283" r="9" fill="#c9dbe4"/>
    <line x1="648" y1="380" x2="680" y2="380" stroke-width="10"/>
    <line x1="1040" y1="380" x2="1072" y2="380" stroke-width="10"/>
    <!-- dial gauge -->
    <line x1="810" y1="262" x2="810" y2="245"/>
    <circle cx="810" cy="205" r="42" fill="#ffffff"/>
    <line x1="810" y1="205" x2="838" y2="180" stroke-width="5"/>
    <circle cx="810" cy="205" r="4" fill="#1a1a1a" stroke="none"/>
    <!-- vent weight and strong steam -->
    <line x1="950" y1="262" x2="950" y2="246"/>
    <rect x="935" y="214" width="30" height="32" rx="6" fill="#a94418"/>
    <g stroke-width="5">
      <path d="M950 202 q -14 -22 0 -44 q 14 -22 0 -44"/>
      <path d="M988 188 q -12 -19 0 -38 q 12 -19 0 -38"/>
    </g>
    <!-- bench line -->
    <line x1="120" y1="620" x2="1080" y2="620"/>
  </g>
</svg>
